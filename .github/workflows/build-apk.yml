                      backgroundColor: tab === i ? C.glass : 'transparent',
                    }}
                    focusedStyle={{ backgroundColor: '#fff' }}>
                    {f => <Text style={[T.btn, { fontSize: u(28), color: f ? '#000' : '#fff' }]}>{t}</Text>}
                  </Focusable>
                ))}
              </View>
            );
          }
          END_OF_FILE
          cat > src/screens/Main.js <<'END_OF_FILE'
          import React, { useState } from 'react';
          import { View } from 'react-native';
          import TopTabs from '../components/TopTabs';
          import Home from './Home';
          import Search from './Search';
          import { C } from '../theme';

          let lastTab = 0;
          export default function Main({ navigation }) {
            const [tab, setTabState] = useState(lastTab);
            const setTab = t => { lastTab = t; setTabState(t); };
            return (
              <View style={{ flex: 1, backgroundColor: C.bg }}>
                {tab === 0 ? <Home nav={navigation} /> : <Search nav={navigation} />}
                <TopTabs tab={tab} onChange={setTab} />
              </View>
            );
          }
          END_OF_FILE
          cat > src/screens/Home.js <<'END_OF_FILE'
          import React from 'react';
          import { FlatList, Image, ScrollView, StyleSheet, Text, View } from 'react-native';
          import LinearGradient from 'react-native-linear-gradient';
          import Button from '../components/Button';
          import Poster, { Art } from '../components/Poster';
          import { ITEMS, ROWS } from '../data';
          import { continueRows, myList } from '../store';
          import { PAD, T, u } from '../theme';

          const extraRows = () => {
            const out = [], c = continueRows(), m = myList();
            if (c.length) out.push({ title: 'ادامه تماشا', items: c });
            if (m.length) out.push({ title: 'فهرست من', items: m });
            return out;
          };

          export default function Home({ nav }) {
            const hero = ITEMS[0];
            return (
              <ScrollView contentContainerStyle={{ paddingBottom: u(80) }}>
                <View style={{ height: u(760) }}>
                  <Art uri={hero.backdrop} seed={hero.id} style={StyleSheet.absoluteFill} />
                  <LinearGradient colors={['rgba(0,0,0,0.25)', 'rgba(0,0,0,0.1)', '#000']} style={StyleSheet.absoluteFill} />
                  <View style={{ position: 'absolute', bottom: u(60), start: PAD, width: u(900) }}>
                    <Text style={T.hero}>{hero.title}</Text>
                    <Text style={[T.meta, { marginTop: u(10) }]}>{hero.meta}</Text>
                    <Text numberOfLines={2} style={[T.body, { marginVertical: u(24) }]}>{hero.desc}</Text>
                    <View style={{ flexDirection: 'row' }}>
                      <Button preferred primary label="پخش" onPress={() => nav.navigate('Player', { id: hero.id })} />
                      <Button label="جزئیات" onPress={() => nav.navigate('Details', { id: hero.id })} />
                    </View>
                  </View>
                </View>

                {[...extraRows(), ...ROWS].map(r => (
                  <View key={r.title}>
                    <Text style={[T.row, { marginStart: PAD, marginTop: u(36) }]}>{r.title}</Text>
                    <FlatList
                      horizontal
                      data={r.items}
                      keyExtractor={i => i.id}
                      showsHorizontalScrollIndicator={false}
                      contentContainerStyle={{ paddingHorizontal: PAD, paddingVertical: u(32) }}
                      renderItem={({ item }) => <Poster item={item} onPress={() => nav.navigate('Details', { id: item.id })} />}
                    />
                  </View>
                ))}
              </ScrollView>
            );
          }
          END_OF_FILE
          cat > src/screens/Search.js <<'END_OF_FILE'
          import React, { useMemo, useState } from 'react';
          import { FlatList, Text, View } from 'react-native';
          import Focusable from '../components/Focusable';
          import Poster from '../components/Poster';
          import { ITEMS } from '../data';
          import { C, PAD, T, u } from '../theme';

          const norm = s => (s || '').replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[\u064B-\u065F\u200c]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
          const KEYS = 'ا ب پ ت ث ج چ ح خ د ذ ر ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن و ه ی'.split(' ');
          const KROWS = [0, 8, 16, 24].map(i => KEYS.slice(i, i + 8));

          function Key({ label, onPress, w = u(88) }) {
            return (
              <Focusable onPress={onPress} scale={1.1}
                style={{ width: w, height: u(88), borderRadius: u(18), marginEnd: u(12), marginBottom: u(12), backgroundColor: C.card, alignItems: 'center', justifyContent: 'center' }}
                focusedStyle={{ backgroundColor: '#fff' }}>
                {f => <Text style={[T.btn, { color: f ? '#000' : '#fff' }]}>{label}</Text>}
              </Focusable>
            );
          }

          export default function Search({ nav }) {
            const [q, setQ] = useState('');
            const res = useMemo(() => {
              const n = norm(q);
              return n ? ITEMS.filter(i => norm(i.title + ' ' + (i.group || '') + ' ' + (i.meta || '')).includes(n)) : ITEMS;
            }, [q]);
            return (
              <View style={{ flex: 1, flexDirection: 'row', paddingTop: u(150), paddingHorizontal: PAD }}>
                <View style={{ width: u(840) }}>
                  <Text numberOfLines={1} style={[T.row, { marginBottom: u(24), color: q ? C.text : C.dim, height: u(60) }]}>{q || 'جستجو'}</Text>
                  {KROWS.map((r, i) => (
                    <View key={i} style={{ flexDirection: 'row' }}>
                      {r.map(k => <Key key={k} label={k} onPress={() => setQ(s => s + k)} />)}
                    </View>
                  ))}
                  <View style={{ flexDirection: 'row' }}>
                    <Key label="فاصله" w={u(300)} onPress={() => setQ(s => s + ' ')} />
                    <Key label="حذف" w={u(190)} onPress={() => setQ(s => s.slice(0, -1))} />
                    <Key label="پاک" w={u(190)} onPress={() => setQ('')} />
                  </View>
                </View>
                <View style={{ flex: 1 }}>
                  <Text style={[T.meta, { marginBottom: u(12) }]}>{res.length} نتیجه</Text>
                  <FlatList
                    key="g3" data={res} numColumns={3} keyExtractor={i => i.id}
                    contentContainerStyle={{ paddingVertical: u(24) }} columnWrapperStyle={{ marginBottom: u(36) }}
                    ListEmptyComponent={<Text style={T.body}>نتیجه‌ای پیدا نشد.</Text>}
                    renderItem={({ item }) => <Poster item={item} onPress={() => nav.navigate('Details', { id: item.id })} />}
                  />
                </View>
              </View>
            );
          }
          END_OF_FILE
          cat > src/screens/Details.js <<'END_OF_FILE'
          import React, { useMemo, useState } from 'react';
          import { FlatList, ScrollView, StyleSheet, Text, View } from 'react-native';
          import LinearGradient from 'react-native-linear-gradient';
          import Button from '../components/Button';
          import Focusable from '../components/Focusable';
          import { Art } from '../components/Poster';
          import { ITEMS } from '../data';
          import { getPos, inList, key, resumeTarget, toggleList } from '../store';
          import { C, PAD, T, u } from '../theme';

          function EpCard({ item, ep, onPress }) {
            const p = getPos(key(item.id, ep.s, ep.e));
            const pr = p && p.d ? p.t / p.d : 0;
            return (
              <Focusable onPress={onPress} scale={1.06} style={{ width: u(440), marginEnd: u(28) }}
                focusedStyle={{ elevation: 16, shadowColor: '#000', shadowOpacity: 0.6, shadowRadius: 20, shadowOffset: { width: 0, height: 12 } }}>
                {f => (
                  <>
                    <View>
                      <Art uri={ep.thumb} seed={ep.e + 1} label={String(ep.e + 1)} style={{ width: u(440), height: u(248), borderRadius: u(16), backgroundColor: C.card }} />
                      {pr > 0 && (
                        <View style={{ position: 'absolute', start: u(14), end: u(14), bottom: u(14), height: u(6), borderRadius: u(3), backgroundColor: 'rgba(255,255,255,0.3)' }}>
                          <View style={{ width: Math.min(100, pr * 100) + '%', height: '100%', borderRadius: u(3), backgroundColor: '#fff' }} />
                        </View>
                      )}
                    </View>
                    <Text numberOfLines={1} style={[T.btn, { fontSize: u(28), marginTop: u(12), color: f ? C.text : C.dim }]}>
                      {`قسمت ${ep.e + 1}` + (ep.title ? '  •  ' + ep.title : '') + (pr > 0.95 ? '  ✓' : '')}
                    </Text>
                  </>
                )}
              </Focusable>
            );
          }

          export default function Details({ route, navigation }) {
            const it = ITEMS.find(i => i.id === route.params.id);
            const target = useMemo(() => resumeTarget(it), [it]);
            const series = !!it.seasons;
            const [season, setSeason] = useState(series ? target.s : 0);
            const [listed, setListed] = useState(inList(it.id));
            const play = (s, e) => navigation.navigate('Player', { id: it.id, s, e });
            const where = series ? `  •  فصل ${target.s + 1} قسمت ${target.e + 1}` : '';
            return (
              <ScrollView style={{ flex: 1, backgroundColor: C.bg }} contentContainerStyle={{ paddingBottom: u(80) }}>
                <View style={{ height: u(780) }}>
                  <Art uri={it.backdrop} seed={it.id} style={StyleSheet.absoluteFill} />
                  <LinearGradient colors={['rgba(0,0,0,0)', 'rgba(0,0,0,0.55)', '#000']} style={StyleSheet.absoluteFill} />
                  <View style={{ position: 'absolute', bottom: u(40), start: PAD, width: u(1000) }}>
                    <Text style={T.hero}>{it.title}</Text>
                    <Text style={[T.meta, { marginTop: u(10) }]}>{it.meta}</Text>
                    <Text numberOfLines={3} style={[T.body, { marginVertical: u(24) }]}>{it.desc}</Text>
                    <View style={{ flexDirection: 'row' }}>
                      <Button preferred primary label={(target.t > 5 ? 'ادامه پخش' : 'پخش') + where} onPress={() => play(target.s, target.e)} />
                      <Button label={listed ? '✓ در فهرست من' : '+ فهرست من'} onPress={() => { toggleList(it.id); setListed(v => !v); }} />
                      <Button label="بازگشت" onPress={() => navigation.goBack()} />
                    </View>
                  </View>
                </View>
                {series && (
                  <View>
                    <FlatList horizontal data={it.seasons} keyExtractor={(_, i) => String(i)} showsHorizontalScrollIndicator={false}
                      contentContainerStyle={{ paddingHorizontal: PAD, paddingVertical: u(20) }}
                      renderItem={({ item: s, index }) => (
                        <Focusable onPress={() => setSeason(index)} scale={1.05}
                          style={{ paddingHorizontal: u(40), height: u(68), borderRadius: u(34), justifyContent: 'center', marginEnd: u(16), backgroundColor: index === season ? C.glass : 'transparent' }}
                          focusedStyle={{ backgroundColor: '#fff' }}>
                          {f => <Text style={[T.btn, { fontSize: u(28), color: f ? '#000' : '#fff' }]}>{s.title || `فصل ${index + 1}`}</Text>}
                        </Focusable>
                      )} />
                    <FlatList horizontal key={season} data={flatSeason(it, season)} keyExtractor={x => String(x.e)} showsHorizontalScrollIndicator={false}
                      contentContainerStyle={{ paddingHorizontal: PAD, paddingVertical: u(28) }}
                      renderItem={({ item: ep }) => <EpCard item={it} ep={ep} onPress={() => play(ep.s, ep.e)} />} />
                  </View>
                )}
              </ScrollView>
            );
          }

          const flatSeason = (it, s) => it.seasons[s].episodes.map((x, e) => ({ ...x, s, e }));
          END_OF_FILE
          cat > src/screens/Player.js <<'END_OF_FILE'
          import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react';
          import { StatusBar, StyleSheet, Text, useTVEventHandler, View } from 'react-native';
          import Video from 'react-native-video';
          import LinearGradient from 'react-native-linear-gradient';
          import Focusable from '../components/Focusable';
          import { ITEMS, flat } from '../data';
          import { getPos, key, resumeTarget, setPos } from '../store';
          import { C, T, u } from '../theme';

          const p2 = n => String(n).padStart(2, '0');
          const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600); return (h ? h + ':' : '') + p2(Math.floor((s % 3600) / 60)) + ':' + p2(s % 60); };
          const RATES = [1, 1.25, 1.5, 2, 0.75];

          function Ctl({ label, onPress, preferred, big }) {
            return (
              <Focusable preferred={preferred} onPress={onPress} scale={1.1}
                style={{ minWidth: u(big ? 120 : 96), height: u(96), paddingHorizontal: u(28), borderRadius: u(48), marginHorizontal: u(8), alignItems: 'center', justifyContent: 'center', backgroundColor: C.glass }}
                focusedStyle={{ backgroundColor: '#fff' }}>
                {f => <Text style={[T.btn, { fontSize: u(big ? 46 : 28), color: f ? '#000' : '#fff' }]}>{label}</Text>}
              </Focusable>
            );
          }

          export default function Player({ route }) {
            const it = ITEMS.find(i => i.id === route.params.id);
            const eps = useMemo(() => flat(it), [it]);
            const init = useMemo(() => {
              const { s, e } = route.params;
              if (s != null) {
                const p = getPos(key(it.id, s, e));
                return { i: Math.max(0, eps.findIndex(x => x.s === s && x.e === e)), t: p && p.d && p.t / p.d < 0.95 ? p.t : 0 };
              }
              const r = resumeTarget(it);
              return { i: Math.max(0, eps.findIndex(x => x.s === r.s && x.e === r.e)), t: r.t };
            }, []);

            const ref = useRef(); const timer = useRef(); const startAt = useRef(init.t);
            const tR = useRef(0); const dR = useRef(0); const kR = useRef(''); const lastSave = useRef(0);
            const [i, setI] = useState(init.i);
            const [paused, setPaused] = useState(false);
            const [t, setT] = useState(0); const [d, setD] = useState(0);
            const [show, setShow] = useState(true); const [failed, setFailed] = useState(false); const [buf, setBuf] = useState(true);
            const [rate, setRate] = useState(0);
            const [subs, setSubs] = useState([]); const [auds, setAuds] = useState([]);
            const [sub, setSub] = useState(-1); const [aud, setAud] = useState(0);
            const ep = eps[i];
            kR.current = key(it.id, ep.s, ep.e);

            const persist = () => { if (dR.current > 0) setPos(kR.current, tR.current, dR.current); };
            useEffect(() => () => persist(), []); // saves the position when leaving the player

            const wake = useCallback(() => { setShow(true); clearTimeout(timer.current); timer.current = setTimeout(() => setShow(false), 5000); }, []);
            useEffect(() => { wake(); return () => clearTimeout(timer.current); }, [wake]);
            const seek = n => ref.current && ref.current.seek(Math.min(d || 1e9, Math.max(0, t + n)));

            const go = n => {
              const j = i + n;
              if (j < 0 || j >= eps.length) return;
              persist();
              startAt.current = 0; tR.current = 0; dR.current = 0;
              setI(j); setT(0); setD(0); setBuf(true); setFailed(false); setSubs([]); setAuds([]); setSub(-1); setAud(0); setPaused(false);
            };

            useTVEventHandler(e => {
              if (!e || e.eventType === 'blur' || e.eventType === 'focus') return;
              if (e.eventType === 'playPause') setPaused(p => !p);
              else if (!show && e.eventType === 'left') seek(10);   // RTL: left = forward
              else if (!show && e.eventType === 'right') seek(-10);
              wake();
            });

            const pct = d ? Math.min(100, (t / d) * 100) : 0;
            const multi = eps.length > 1;
            return (
              <View style={{ flex: 1, backgroundColor: '#000' }}>
                <StatusBar hidden />
                <Video
                  ref={ref} source={{ uri: ep.url }} style={StyleSheet.absoluteFill} resizeMode="contain" controls={false}
                  paused={paused} rate={RATES[rate]} progressUpdateInterval={500}
                  selectedTextTrack={sub < 0 ? { type: 'disabled' } : { type: 'index', value: sub }}
                  selectedAudioTrack={{ type: 'index', value: aud }}
                  onLoad={e => {
                    setD(e.duration); dR.current = e.duration; setBuf(false); setSubs(e.textTracks || []); setAuds(e.audioTracks || []);
                    if (startAt.current > 5 && ref.current) ref.current.seek(startAt.current);
                    startAt.current = 0;
                  }}
                  onProgress={e => {
                    setT(e.currentTime); tR.current = e.currentTime;
                    if (e.currentTime - lastSave.current > 5 || e.currentTime < lastSave.current) { lastSave.current = e.currentTime; persist(); }
                  }}
                  onBuffer={e => setBuf(e.isBuffering)}
                  onEnd={() => { tR.current = dR.current; persist(); if (i < eps.length - 1) go(1); else { setPaused(true); setShow(true); } }}
                  onError={() => setFailed(true)}
                />
                {buf && !failed && <Text style={[T.btn, { position: 'absolute', alignSelf: 'center', top: '46%' }]}>در حال بارگذاری…</Text>}
                {failed && <Text style={[T.row, { position: 'absolute', alignSelf: 'center', top: '45%', textAlign: 'center' }]}>پخش انجام نشد. لینک ویدیو را بررسی کنید.</Text>}
                {show && (
                  <>
                    <LinearGradient colors={['rgba(0,0,0,0.75)', 'transparent']} style={{ position: 'absolute', top: 0, start: 0, end: 0, height: u(260), paddingHorizontal: u(90), paddingTop: u(60) }}>
                      <Text style={T.hero}>{it.title}</Text>
                      {it.seasons && <Text style={T.meta}>{`${ep.season}  •  قسمت ${ep.e + 1}` + (ep.title ? '  •  ' + ep.title : '')}</Text>}
                    </LinearGradient>
                    <LinearGradient colors={['transparent', 'rgba(0,0,0,0.85)']} style={{ position: 'absolute', bottom: 0, start: 0, end: 0, paddingHorizontal: u(90), paddingBottom: u(60), paddingTop: u(120) }}>
                      <View style={{ height: u(8), borderRadius: u(4), backgroundColor: 'rgba(255,255,255,0.28)', overflow: 'hidden' }}>
                        <View style={{ width: pct + '%', height: '100%', backgroundColor: '#fff' }} />
                      </View>
                      <View style={{ flexDirection: 'row', justifyContent: 'space-between', marginTop: u(12), marginBottom: u(24) }}>
                        <Text style={T.meta}>{fmt(t)}</Text>
                        <Text style={T.meta}>-{fmt(d - t)}</Text>
                      </View>
                      <View style={{ flexDirection: 'row', justifyContent: 'center' }}>
                        {multi && i > 0 && <Ctl label="قسمت قبل" onPress={() => go(-1)} />}
                        <Ctl label="١٠ ↺" onPress={() => seek(-10)} />
                        <Ctl big preferred label={paused ? '▶' : '❚❚'} onPress={() => setPaused(p => !p)} />
                        <Ctl label="↻ ١٠" onPress={() => seek(10)} />
                        {multi && i < eps.length - 1 && <Ctl label="قسمت بعد" onPress={() => go(1)} />}
                        <Ctl label={RATES[rate] + 'x'} onPress={() => setRate(r => (r + 1) % RATES.length)} />
                        {subs.length > 0 && <Ctl label={sub < 0 ? 'زیرنویس: خاموش' : 'زیرنویس: ' + (subs[sub].title || sub + 1)} onPress={() => setSub(s => (s + 1 >= subs.length ? -1 : s + 1))} />}
                        {auds.length > 1 && <Ctl label={'صدا: ' + (auds[aud].title || aud + 1)} onPress={() => setAud(a => (a + 1) % auds.length)} />}
                      </View>
                    </LinearGradient>
                  </>
                )}
              </View>
            );
          }
          END_OF_FILE

      - name: Download Vazir font
        run: |
          curl -fL -o DelfanTV/assets/fonts/Vazir.ttf https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf || rm -f DelfanTV/assets/fonts/Vazir.ttf
          cd DelfanTV && npx --yes react-native-asset

      - name: Enable RTL
        run: |
          python3 - <<'EOF'
          import glob
          files = glob.glob('DelfanTV/android/**/MainApplication.*', recursive=True)
          for f in files:
              with open(f, 'r', encoding='utf-8') as fp:
                  code = fp.read()
              if 'I18nUtil' not in code:
                  semi = ';' if f.endswith('.java') else ''
                  code = code.replace(
                      'import com.facebook.react.ReactApplication',
                      f'import com.facebook.react.modules.i18nmanager.I18nUtil{semi}\nimport com.facebook.react.ReactApplication'
                  )
                  code = code.replace(
                      'super.onCreate()',
                      f'super.onCreate(){semi}\n    I18nUtil.getInstance().allowRTL(this, true){semi}\n    I18nUtil.getInstance().forceRTL(this, true){semi}'
                  )
                  with open(f, 'w', encoding='utf-8') as fp:
                      fp.write(code)
          EOF

      - name: Allow http streams
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' DelfanTV/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          cd DelfanTV/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DelfanTV-apk
          path: DelfanTV/android/app/build/outputs/apk/release/*.apk
