name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: true
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create TV project
        run: |
          npx --yes @react-native-community/cli@latest init DelfanTV \
            --template @react-native-tvos/template-tv \
            --skip-install \
            --skip-git-init \
            --pm npm

      - name: Install dependencies
        run: |
          cd DelfanTV
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps \
            react-native-video@^6.6.4 \
            react-native-linear-gradient@^2.8.3 \
            @react-native-async-storage/async-storage@1.24.0

      - name: Write app files
        run: |
          cd DelfanTV
          rm -f App.tsx
          mkdir -p src/components src/screens assets/fonts
          cat > App.js <<'END_OF_FILE'
          import React, { useEffect, useState } from 'react';
          import { BackHandler, View } from 'react-native';
          import { loadCatalog } from './src/data';
          import { loadStore } from './src/store';
          import Main from './src/screens/Main';
          import Details from './src/screens/Details';
          import Player from './src/screens/Player';

          export default function App() {
            const [stack, setStack] = useState([{ name: 'Main', params: {} }]);
            const [ready, setReady] = useState(false);
            useEffect(() => { Promise.all([loadCatalog(), loadStore()]).finally(() => setReady(true)); }, []);
            const current = stack[stack.length - 1];

            const navigation = {
              navigate: (name, params = {}) => setStack(s => [...s, { name, params }]),
              goBack: () => setStack(s => (s.length > 1 ? s.slice(0, -1) : s)),
            };

            useEffect(() => {
              const sub = BackHandler.addEventListener('hardwareBackPress', () => {
                if (stack.length > 1) {
                  setStack(s => s.slice(0, -1));
                  return true;
                }
                return false;
              });
              return () => sub.remove();
            }, [stack.length]);

            if (!ready) return <View style={{ flex: 1, backgroundColor: '#000' }} />;
            return (
              <View style={{ flex: 1, backgroundColor: '#000' }}>
                {current.name === 'Main' && <Main navigation={navigation} route={current} />}
                {current.name === 'Details' && <Details navigation={navigation} route={current} />}
                {current.name === 'Player' && <Player navigation={navigation} route={current} />}
              </View>
            );
          }
          END_OF_FILE
          cat > index.js <<'END_OF_FILE'
          import { AppRegistry, I18nManager } from 'react-native';
          import App from './App';

          I18nManager.allowRTL(true);
          I18nManager.forceRTL(true);

          AppRegistry.registerComponent('DelfanTV', () => App);
          END_OF_FILE
          cat > react-native.config.js <<'END_OF_FILE'
          module.exports = { assets: ['./assets/fonts'] };
          END_OF_FILE
          cat > src/theme.js <<'END_OF_FILE'
          import { Dimensions } from 'react-native';

          export const u = n => Math.round((n * Dimensions.get('window').width) / 1920);

          export const C = {
            bg: '#000000',
            card: '#1C1C1E',
            text: '#FFFFFF',
            dim: 'rgba(235,235,245,0.6)',
            glass: 'rgba(255,255,255,0.16)',
          };

          const base = { fontFamily: 'Vazir' };
          export const T = {
            hero: { ...base, fontSize: u(76), color: C.text, fontWeight: 'bold' },
            row: { ...base, fontSize: u(38), color: C.text, fontWeight: 'bold' },
            body: { ...base, fontSize: u(30), lineHeight: u(46), color: C.dim },
            meta: { ...base, fontSize: u(28), color: C.dim },
            btn: { ...base, fontSize: u(30), fontWeight: 'bold' },
          };

          export const PAD = u(90);
          END_OF_FILE
          cat > src/config.js <<'END_OF_FILE'
          // Static switch (not detected at runtime):
          //   true  = full app: Home, Movies, Series, Clips, Search
          //   false = limited mode: Home + Search with only the first 12 titles
          export const IIRN = true;

          // URL of YOUR OWN catalog (content you have the rights to use). JSON object (or a plain array of titles):
          // {
          //   "items": [
          //     { "id":"1", "title":"...", "year":2021, "desc":"...", "poster":"https://...jpg", "backdrop":"https://...jpg",
          //       "url":"https://.../index.m3u8",            // movie; for a series use "seasons" instead (below)
          //       "audio":"dub" | "sub" | "orig",            // Persian dubbed / subtitled / original
          //       "genre":["درام","معمایی"], "country":"ایران", "rating":"7.8", "cast":["..."],
          //       "featured":true, "collection":"نام مجموعه", "related":["2","5"],
          //       "subtitles":[{ "title":"فارسی", "language":"fa", "uri":"https://.../fa.vtt" }],
          //       "seasons":[{ "title":"فصل ۱", "episodes":[{ "title":"...", "url":"https://.../e1.m3u8", "thumb":"https://...jpg" }] }] }
          //   ],
          //   "clips": [ { "id":"1", "title":"تیزر", "url":"https://.../clip.m3u8", "thumb":"https://...jpg" } ]
          // }
          // An M3U playlist also works (names like "Name S01E02" become a series). Leave empty for the demo items.
          export const CATALOG_URL = '';

          // Extra query parameters added to every catalog request (static values, never detected).
          // Example: your own server can read iirn=T and return the full catalog.
          export const CATALOG_QUERY = { iirn: 'T' };
          END_OF_FILE
          cat > src/data.js <<'END_OF_FILE'
          import { CATALOG_URL, CATALOG_QUERY, IIRN } from './config';

          const URLS = [
            'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8',
            'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
            'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8',
            'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8',
          ];
          const TITLES = ['شب‌های تهران', 'دریای آرام', 'مسافر', 'کوچه‌باغ', 'آخرین ایستگاه', 'پرواز', 'سایه‌ها', 'خانه‌ی کاغذی', 'رد پا'];
          const GENRES = ['درام', 'ماجراجویی', 'کمدی', 'معمایی'];
          const COUNTRIES = ['ایران', 'آمریکا', 'فرانسه'];
          const AUDIO = ['dub', 'sub', 'orig'];
          const AUDLAB = { dub: 'دوبله فارسی', sub: 'زیرنویس', orig: 'زبان اصلی' };
          const ep = (n, i) => ({ title: '', url: URLS[(i + n) % URLS.length], desc: '', thumb: '' });

          const SAMPLE = TITLES.map((title, i) => {
            const base = {
              id: String(i + 1), title, year: 2018 + i, genre: [GENRES[i % 4]], country: COUNTRIES[i % 3], audio: AUDIO[i % 3],
              rating: (6 + ((i * 7) % 30) / 10).toFixed(1), cast: ['علی احمدی', 'سارا کریمی', 'مهدی رضایی'], featured: i % 4 === 0,
              collection: i < 5 ? 'مجموعه ویژه' : '', poster: '', backdrop: '',
              desc: 'این یک آیتم نمونه است. آدرس کاتالوگ خودتان را در src/config.js بگذارید.',
            };
            if (i < 3) return { ...base, seasons: [1, 2].map(s => ({ title: `فصل ${s}`, episodes: [1, 2, 3, 4].map(n => ep(n, i + s)) })) };
            return { ...base, url: URLS[i % URLS.length] };
          });
          const SAMPLE_CLIPS = ['تیزر ۱', 'تیزر ۲', 'تریلر ۱', 'تریلر ۲', 'سکانس ۱', 'سکانس ۲'].map((title, i) => ({ id: String(i + 1), title, url: URLS[i % URLS.length], thumb: '' }));

          export const ITEMS = [];
          export const ROWS = [];
          export const CLIPS = [];

          // One playable unit per episode (a movie or clip is a single unit with s = e = null).
          export const flat = it => it.seasons
            ? it.seasons.flatMap((s, si) => s.episodes.map((x, ei) => ({ ...x, s: si, e: ei, season: s.title })))
            : [{ ...it, s: null, e: null, season: '' }];
          export const findItem = id => ITEMS.find(i => i.id === id) || CLIPS.find(i => i.id === id);

          const uniq = a => [...new Set(a)];
          const norm = (x, i) => {
            const genre = [].concat(x.genre || []);
            const o = { id: String(i + 1), desc: '', poster: '', cast: [], country: '', audio: '', ...x, genre };
            o.id = String(o.id);
            o.backdrop = x.backdrop || x.poster || '';
            o.collection = x.collection || x.group || '';
            o.meta = x.meta || [x.year, ...genre.slice(0, 2), o.country, AUDLAB[o.audio], x.rating ? '★ ' + x.rating : ''].filter(Boolean).join('  •  ');
            return o;
          };

          function setItems(list, clips) {
            if (!IIRN) { list = list.slice(0, 12); clips = []; }
            ITEMS.length = 0; ITEMS.push(...list);
            CLIPS.length = 0; CLIPS.push(...clips.map((c, i) => ({ ...c, id: 'c' + (c.id != null ? c.id : i + 1) })));
            ROWS.length = 0;
            const add = (title, items) => { if (items.length) ROWS.push({ title, items }); };
            add('فیلم‌های جدید', list.filter(i => !i.seasons).slice(0, 12));
            add('سریال‌های جدید', list.filter(i => i.seasons).slice(0, 12));
            add('ویژه', list.filter(i => i.featured));
            uniq(list.map(i => i.collection).filter(Boolean)).forEach(c => add(c, list.filter(i => i.collection === c)));
            uniq(list.flatMap(i => i.genre)).forEach(g => add(g, list.filter(i => i.genre.includes(g))));
          }

          function parseM3U(text) {
            const raw = []; let cur = null;
            text.split(/\r?\n/).forEach(r => {
              const l = r.trim();
              if (l.startsWith('#EXTINF')) {
                const a = k => (l.match(new RegExp(k + '="([^"]*)"')) || [])[1] || '';
                cur = { title: l.split(',').slice(1).join(',').trim() || a('tvg-name'), poster: a('tvg-logo'), group: a('group-title') };
              } else if (l && !l.startsWith('#') && cur) { raw.push({ ...cur, url: l }); cur = null; }
            });
            const series = {}, out = [];
            raw.forEach(x => {
              const m = x.title.match(/^(.*?)[\s._-]*S(\d+)[\s._-]*E(\d+)/i);
              if (!m) { out.push(x); return; }
              const name = m[1].trim() || x.title;
              let it = series[name];
              if (!it) { it = { ...x, title: name, url: undefined, seasons: {} }; series[name] = it; out.push(it); }
              (it.seasons[+m[2]] = it.seasons[+m[2]] || []).push({ n: +m[3], title: '', url: x.url });
            });
            out.forEach(it => {
              if (it.seasons) it.seasons = Object.keys(it.seasons).sort((a, b) => a - b).map(k => ({ title: `فصل ${+k}`, episodes: it.seasons[k].sort((a, b) => a.n - b.n) }));
            });
            return out;
          }

          export async function loadCatalog() {
            let list = SAMPLE, clips = SAMPLE_CLIPS;
            if (CATALOG_URL) {
              try {
                const q = Object.entries(CATALOG_QUERY || {}).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
                const t = await (await fetch(q ? CATALOG_URL + (CATALOG_URL.includes('?') ? '&' : '?') + q : CATALOG_URL)).text();
                const j = /^\s*[\[{]/.test(t) ? JSON.parse(t) : parseM3U(t);
                const arr = Array.isArray(j) ? j : j.items;
                if (arr && arr.length) { list = arr; clips = (!Array.isArray(j) && j.clips) || []; }
              } catch (e) {}
            }
            setItems(list.map(norm), clips);
          }
          END_OF_FILE
          cat > src/store.js <<'END_OF_FILE'
          import AsyncStorage from '@react-native-async-storage/async-storage';
          import { ITEMS, flat } from './data';

          // Everything is stored on the device only (no account): watch list + playback positions.
          const K = 'soroushflix:v1';
          let S = { list: [], pos: {} };

          export async function loadStore() {
            try { const r = await AsyncStorage.getItem(K); if (r) S = { ...S, ...JSON.parse(r) }; } catch (e) {}
          }
          const save = () => AsyncStorage.setItem(K, JSON.stringify(S)).catch(() => {});

          export const key = (id, s, e) => (s == null ? id : `${id}:${s}:${e}`);
          export const inList = id => S.list.includes(id);
          export const myList = () => S.list.map(id => ITEMS.find(i => i.id === id)).filter(Boolean);
          export function toggleList(id) { S.list = inList(id) ? S.list.filter(x => x !== id) : [id, ...S.list]; save(); }
          export const getPos = k => S.pos[k];
          export function setPos(k, t, d) { S.pos[k] = { t, d, at: Date.now() }; save(); }
          const done = p => p && p.d && p.t / p.d > 0.95;

          function lastOf(it) {
            const l = flat(it); let last = -1, at = 0;
            l.forEach((x, i) => { const p = S.pos[key(it.id, x.s, x.e)]; if (p && p.at > at) { at = p.at; last = i; } });
            return { l, last, at, p: last < 0 ? null : S.pos[key(it.id, l[last].s, l[last].e)] };
          }

          // Where "Play" should go: resume the unfinished episode, else the next one, else the first.
          export function resumeTarget(it) {
            const { l, last, p } = lastOf(it);
            if (last < 0) return { ...l[0], t: 0 };
            if (!done(p)) return { ...l[last], t: p.t };
            return { ...(l[last + 1] || l[0]), t: 0 };
          }

          export function continueRows() {
            return ITEMS.map(it => {
              const { l, last, at, p } = lastOf(it);
              if (last < 0 || (done(p) && last === l.length - 1)) return null;
              return { ...it, at, progress: done(p) ? 0 : p.t / p.d };
            }).filter(Boolean).sort((a, b) => b.at - a.at);
          }
          END_OF_FILE
          cat > src/components/Focusable.js <<'END_OF_FILE'
          import React, { useRef, useState } from 'react';
          import { Animated, Pressable } from 'react-native';

          export default function Focusable({ children, style, focusedStyle, onPress, scale = 1.08, preferred }) {
            const s = useRef(new Animated.Value(1)).current;
            const [f, setF] = useState(false);
            const to = v => Animated.spring(s, { toValue: v, useNativeDriver: true, friction: 8, tension: 90 }).start();
            return (
              <Pressable
                hasTVPreferredFocus={preferred}
                onPress={onPress}
                onFocus={() => { setF(true); to(scale); }}
                onBlur={() => { setF(false); to(1); }}>
                <Animated.View style={[style, { transform: [{ scale: s }] }, f && focusedStyle]}>
                  {typeof children === 'function' ? children(f) : children}
                </Animated.View>
              </Pressable>
            );
          }
          END_OF_FILE
          cat > src/components/Button.js <<'END_OF_FILE'
          import React from 'react';
          import { Text } from 'react-native';
          import Focusable from './Focusable';
          import { C, T, u } from '../theme';

          export default function Button({ label, primary, onPress, preferred }) {
            return (
              <Focusable
                preferred={preferred}
                onPress={onPress}
                scale={1.06}
                style={{
                  paddingHorizontal: u(52), height: u(80), borderRadius: u(40),
                  justifyContent: 'center', marginEnd: u(20),
                  backgroundColor: primary ? '#fff' : C.glass,
                }}
                focusedStyle={{ backgroundColor: '#fff' }}>
                {f => <Text style={[T.btn, { color: primary || f ? '#000' : '#fff' }]}>{label}</Text>}
              </Focusable>
            );
          }
          END_OF_FILE
          cat > src/components/Poster.js <<'END_OF_FILE'
          import React, { useState } from 'react';
          import { Image, Text, View } from 'react-native';
          import LinearGradient from 'react-native-linear-gradient';
          import Focusable from './Focusable';
          import { C, T, u } from '../theme';

          const PAL = [['#3A1C71', '#D76D77'], ['#0F2027', '#2C5364'], ['#42275A', '#734B6D'], ['#134E5E', '#71B280'], ['#232526', '#5a5d60'], ['#654EA3', '#EAAFC8']];

          // Remote image with a gradient fallback (used when there is no URL or it fails to load, e.g. blocked host).
          export function Art({ uri, seed, style, label }) {
            const [bad, setBad] = useState(!uri);
            if (bad) {
              return (
                <LinearGradient colors={PAL[(parseInt(seed, 10) || 0) % PAL.length]} start={{ x: 0, y: 0 }} end={{ x: 1, y: 1 }}
                  style={[style, { alignItems: 'center', justifyContent: 'center' }]}>
                  {label ? <Text style={[T.row, { textAlign: 'center', padding: u(16) }]}>{label}</Text> : null}
                </LinearGradient>
              );
            }
            return <Image key={uri} source={{ uri }} style={style} onError={() => setBad(true)} />;
          }

          export default function Poster({ item, onPress, w = u(240), gap = u(32) }) {
            return (
              <Focusable onPress={onPress} scale={1.1} style={{ width: w, marginEnd: gap }}
                focusedStyle={{ elevation: 16, shadowColor: '#000', shadowOpacity: 0.6, shadowRadius: 20, shadowOffset: { width: 0, height: 12 } }}>
                {f => (
                  <>
                    <View>
                      <Art uri={item.poster} seed={item.id} label={item.title} style={{ width: w, height: w * 1.5, borderRadius: u(18), backgroundColor: C.card }} />
                      {item.progress > 0 && (
                        <View style={{ position: 'absolute', start: u(14), end: u(14), bottom: u(16), height: u(6), borderRadius: u(3), backgroundColor: 'rgba(255,255,255,0.3)' }}>
                          <View style={{ width: item.progress * 100 + '%', height: '100%', borderRadius: u(3), backgroundColor: '#fff' }} />
                        </View>
                      )}
                    </View>
                    <Text numberOfLines={1} style={[T.meta, { marginTop: u(14), color: f ? C.text : C.dim }]}>{item.title}</Text>
                  </>
                )}
              </Focusable>
            );
          }
          END_OF_FILE
          cat > src/components/TopTabs.js <<'END_OF_FILE'
          import React from 'react';
          import { Text, View } from 'react-native';
          import Focusable from './Focusable';
          import { C, T, u } from '../theme';

          export default function TopTabs({ tabs, tab, onChange }) {
            return (
              <View style={{
                position: 'absolute', top: u(36), alignSelf: 'center', zIndex: 10, flexDirection: 'row',
                padding: u(8), borderRadius: u(48), backgroundColor: 'rgba(44,44,46,0.72)',
              }}>
                {tabs.map((t, i) => (
                  <Focusable
                    key={t}
                    onPress={() => onChange(i)}
                    scale={1.05}
                    style={{
                      paddingHorizontal: u(52), height: u(68), borderRadius: u(34), justifyContent: 'center',
                      backgroundColor: tab === i ? C.glass : 'transparent',
                    }}
                    focusedStyle={{ backgroundColor: '#fff' }}>
                    {f => <Text style={[T.btn, { fontSize: u(28), color: f ? '#000' : '#fff' }]}>{t}</Text>}
                  </Focusable>
                ))}
              </View>
            );
          }
          END_OF_FILE
          cat > src/screens/Main.js <<'END_OF_FILE'
          import React, { useState } from 'react';
          import { View } from 'react-native';
          import TopTabs from '../components/TopTabs';
          import Home from './Home';
          import Search from './Search';
          import Browse from './Browse';
          import Clips from './Clips';
          import { C } from '../theme';
          import { IIRN } from '../config';

          const TABS = IIRN
            ? [['home', 'خانه'], ['movie', 'فیلم‌ها'], ['serie', 'سریال‌ها'], ['clips', 'کلیپ‌ها'], ['search', 'جستجو']]
            : [['home', 'خانه'], ['search', 'جستجو']];

          let lastTab = 0;
          export default function Main({ navigation }) {
            const [tab, setTabState] = useState(Math.min(lastTab, TABS.length - 1));
            const setTab = t => { lastTab = t; setTabState(t); };
            const id = TABS[tab][0];
            return (
              <View style={{ flex: 1, backgroundColor: C.bg }}>
                {id === 'home' ? <Home nav={navigation} /> : id === 'search' ? <Search nav={navigation} />
                  : id === 'clips' ? <Clips nav={navigation} /> : <Browse key={id} kind={id} nav={navigation} />}
                <TopTabs tabs={TABS.map(t => t[1])} tab={tab} onChange={setTab} />
              </View>
            );
          }
          END_OF_FILE
          cat > src/screens/Home.js <<'END_OF_FILE'
          import React from 'react';
          import { FlatList, Image, ScrollView, StyleSheet, Text, View } from 'react-native';
          import LinearGradient from 'react-native-linear-gradient';
          import Button from '../components/Button';
          import Poster, { Art } from '../components/Poster';
          import { ITEMS, ROWS } from '../data';
          import { continueRows, myList } from '../store';
          import { PAD, T, u } from '../theme';

          const extraRows = () => {
            const out = [], c = continueRows(), m = myList();
            if (c.length) out.push({ title: 'ادامه تماشا', items: c });
            if (m.length) out.push({ title: 'فهرست من', items: m });
            return out;
          };

          export default function Home({ nav }) {
            const hero = ITEMS.find(i => i.featured) || ITEMS[0];
            return (
              <ScrollView contentContainerStyle={{ paddingBottom: u(80) }}>
                <View style={{ height: u(760) }}>
                  <Art uri={hero.backdrop} seed={hero.id} style={StyleSheet.absoluteFill} />
                  <LinearGradient colors={['rgba(0,0,0,0.25)', 'rgba(0,0,0,0.1)', '#000']} style={StyleSheet.absoluteFill} />
                  <View style={{ position: 'absolute', bottom: u(60), start: PAD, width: u(900) }}>
                    <Text style={T.hero}>{hero.title}</Text>
                    <Text style={[T.meta, { marginTop: u(10) }]}>{hero.meta}</Text>
                    <Text numberOfLines={2} style={[T.body, { marginVertical: u(24) }]}>{hero.desc}</Text>
                    <View style={{ flexDirection: 'row' }}>
                      <Button preferred primary label="پخش" onPress={() => nav.navigate('Player', { id: hero.id })} />
                      <Button label="جزئیات" onPress={() => nav.navigate('Details', { id: hero.id })} />
                    </View>
                  </View>
                </View>

                {[...extraRows(), ...ROWS].map(r => (
                  <View key={r.title}>
                    <Text style={[T.row, { marginStart: PAD, marginTop: u(36) }]}>{r.title}</Text>
                    <FlatList
                      horizontal
                      data={r.items}
                      keyExtractor={i => i.id}
                      showsHorizontalScrollIndicator={false}
                      contentContainerStyle={{ paddingHorizontal: PAD, paddingVertical: u(32) }}
                      renderItem={({ item }) => <Poster item={item} onPress={() => nav.navigate('Details', { id: item.id })} />}
                    />
                  </View>
                ))}
              </ScrollView>
            );
          }
          END_OF_FILE
          cat > src/screens/Browse.js <<'END_OF_FILE'
          import React, { useMemo, useState } from 'react';
          import { FlatList, Text, View } from 'react-native';
          import Focusable from '../components/Focusable';
