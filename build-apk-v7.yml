            const seek = n => ref.current && ref.current.seek(Math.min(d || 1e9, Math.max(0, t + n)));

            const tracks = (ts, as) => {
              if (ts) {
                setSubs(ts);
                if (!subInit.current && ts.length) { subInit.current = true; setSub(ts.findIndex(isFa)); } // Persian subtitle by default
              }
