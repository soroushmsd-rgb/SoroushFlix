                  selectedAudioTrack={aud < 0 ? { type: 'system' } : { type: 'index', value: auds[aud] && auds[aud].index != null ? auds[aud].index : aud }}
                  onLoad={e => {
                    setD(e.duration); dR.current = e.duration; setBuf(false); tracks(e.textTracks || [], e.audioTracks || []);
                    if (startAt.current > 5 && ref.current) ref.current.seek(startAt.current);
