          const isFa = t => /^(fa|fas|per|prs)/i.test(t.language || '') || /فارسی|persian|farsi/i.test(t.title || '');
          const lab = (t, i, k) => t.title || t.language || `${k} ${i + 1}`;

          function Ctl({ label, onPress, preferred, big }) {
            return (
              <Focusable preferred={preferred} onPress={onPress} scale={1.1}
                style={{ minWidth: u(big ? 120 : 96), height: u(96), paddingHorizontal: u(28), borderRadius: u(48), marginHorizontal: u(8), alignItems: 'center', justifyContent: 'center', backgroundColor: C.glass }}
                focusedStyle={{ backgroundColor: '#fff' }}>
                {f => <Text style={[T.btn, { fontSize: u(big ? 46 : 28), color: f ? '#000' : '#fff' }]}>{label}</Text>}
              </Focusable>
            );
          }

          function Opt({ label, on, onPress, preferred }) {
            return (
              <Focusable preferred={preferred} onPress={onPress} scale={1.03}
                style={{ height: u(76), borderRadius: u(16), paddingHorizontal: u(24), marginBottom: u(10), justifyContent: 'center', backgroundColor: on ? C.glass : 'transparent' }}
                focusedStyle={{ backgroundColor: '#fff' }}>
                {f => <Text numberOfLines={1} style={[T.btn, { fontSize: u(28), color: f ? '#000' : '#fff' }]}>{(on ? '✓  ' : '') + label}</Text>}
              </Focusable>
            );
          }

          export default function Player({ route }) {
            const it = findItem(route.params.id);
            const eps = useMemo(() => flat(it), [it]);
            const init = useMemo(() => {
              const { s, e } = route.params;
              if (s != null) {
