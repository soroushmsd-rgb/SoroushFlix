            useEffect(() => () => persist(), []); // saves the position when leaving the player

            const wake = useCallback(() => { setShow(true); clearTimeout(timer.current); timer.current = setTimeout(() => setShow(false), 5000); }, []);
            useEffect(() => { wake(); return () => clearTimeout(timer.current); }, [wake]);
            useEffect(() => {
              const s = BackHandler.addEventListener('hardwareBackPress', () => { if (menu) { setMenu(false); wake(); return true; } return false; });
              return () => s.remove();
