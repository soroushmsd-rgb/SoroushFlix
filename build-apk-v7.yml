                    <View style={{ width: u(1200), flexDirection: 'row', padding: u(40), borderRadius: u(32), backgroundColor: 'rgba(28,28,30,0.97)' }}>
                      <View style={{ flex: 1, marginEnd: u(40) }}>
                        <Text style={[T.row, { marginBottom: u(20) }]}>صدا</Text>
                        {auds.length === 0 && <Text style={T.meta}>فقط یک صدا موجود است</Text>}
                        {auds.map((a, k) => <Opt key={k} preferred={k === selAud} on={k === selAud} label={lab(a, k, 'صدا')} onPress={() => setAud(k)} />)}
                      </View>
                      <View style={{ flex: 1 }}>
                        <Text style={[T.row, { marginBottom: u(20) }]}>زیرنویس</Text>
                        <Opt preferred={auds.length === 0} on={sub < 0} label="خاموش" onPress={() => setSub(-1)} />
                        {subs.map((s, k) => <Opt key={k} on={k === sub} label={lab(s, k, 'زیرنویس')} onPress={() => setSub(k)} />)}
                        <Opt label="بستن" onPress={() => { setMenu(false); wake(); }} />
                      </View>
                    </View>
                  </View>
                )}
              </View>
            );
          }
          END_OF_FILE

      - name: Download Vazir font
        run: |
          curl -fL -o DelfanTV/assets/fonts/Vazir.ttf https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf || rm -f DelfanTV/assets/fonts/Vazir.ttf
          cd DelfanTV && npx --yes react-native-asset

      - name: Enable RTL
        run: |
          python3 - <<'EOF'
          import glob
          files = glob.glob('DelfanTV/android/**/MainApplication.*', recursive=True)
          for f in files:
              with open(f, 'r', encoding='utf-8') as fp:
                  code = fp.read()
              if 'I18nUtil' not in code:
                  semi = ';' if f.endswith('.java') else ''
                  code = code.replace(
                      'import com.facebook.react.ReactApplication',
                      f'import com.facebook.react.modules.i18nmanager.I18nUtil{semi}\nimport com.facebook.react.ReactApplication'
                  )
                  code = code.replace(
                      'super.onCreate()',
                      f'super.onCreate(){semi}\n    I18nUtil.getInstance().allowRTL(this, true){semi}\n    I18nUtil.getInstance().forceRTL(this, true){semi}'
                  )
                  with open(f, 'w', encoding='utf-8') as fp:
                      fp.write(code)
          EOF

      - name: Allow http streams
        run: |
          python3 - <<'EOF'
          import re
          p = 'DelfanTV/android/app/src/main/AndroidManifest.xml'
          x = open(p, encoding='utf-8').read()
          if 'usesCleartextTraffic' in x:
              x = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', x)
          else:
              x = x.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          open(p, 'w', encoding='utf-8').write(x)
          EOF

      - name: Build release APK
        run: |
          cd DelfanTV/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DelfanTV-apk
          path: DelfanTV/android/app/build/outputs/apk/release/*.apk
