            const [sub, setSub] = useState(-1); const [aud, setAud] = useState(-1);
            const ep = eps[i];
            kR.current = key(it.id, ep.s, ep.e);

            // Optional external subtitle files from the catalog (episode first, then title).
            const ext = useMemo(() => {
              const l = ep.subtitles || it.subtitles;
              return l && l.length ? l.map(x => ({ title: x.title || 'فارسی', language: x.language || 'fa', type: x.type || (/\.srt($|\?)/i.test(x.uri) ? 'application/x-subrip' : 'text/vtt'), uri: x.uri })) : undefined;
            }, [i]);

