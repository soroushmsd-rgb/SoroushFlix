                {show && !menu && (
                  <>
                    <LinearGradient colors={['rgba(0,0,0,0.75)', 'transparent']} style={{ position: 'absolute', top: 0, start: 0, end: 0, height: u(260), paddingHorizontal: u(90), paddingTop: u(60) }}>
                      <Text style={T.hero}>{it.title}</Text>
                      {it.seasons && <Text style={T.meta}>{`${ep.season}  •  قسمت ${ep.e + 1}` + (ep.title ? '  •  ' + ep.title : '')}</Text>}
                    </LinearGradient>
                    <LinearGradient colors={['transparent', 'rgba(0,0,0,0.85)']} style={{ position: 'absolute', bottom: 0, start: 0, end: 0, paddingHorizontal: u(90), paddingBottom: u(60), paddingTop: u(120) }}>
                      <View style={{ height: u(8), borderRadius: u(4), backgroundColor: 'rgba(255,255,255,0.28)', overflow: 'hidden' }}>
                        <View style={{ width: pct + '%', height: '100%', backgroundColor: '#fff' }} />
                      </View>
                      <View style={{ flexDirection: 'row', justifyContent: 'space-between', marginTop: u(12), marginBottom: u(24) }}>
