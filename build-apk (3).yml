          import React from 'react';
          import { FlatList, Image, ScrollView, StyleSheet, Text, View } from 'react-native';
          import LinearGradient from 'react-native-linear-gradient';
          import Button from '../components/Button';
          import Poster from '../components/Poster';
          import { ITEMS } from '../data';
          import { C, PAD, T, u } from '../theme';

          export default function Home({ nav, filterType, appState }) {
            const { myList, toggleMyList, progress } = appState;

            const filtered = filterType
              ? ITEMS.filter(i => i.type === filterType)
              : ITEMS;

            const hero = filtered[0] || ITEMS[0];
            const inHeroList = myList.includes(hero.id);

            const continueItems = ITEMS.filter(i => progress[i.id] && progress[i.id].ratio > 0.02);
            const myListItems = ITEMS.filter(i => myList.includes(i.id));

            const rows = [];
            if (!filterType && continueItems.length > 0) {
              rows.push({ title: 'Up Next (Continue Watching)', items: continueItems });
            }
            if (!filterType && myListItems.length > 0) {
              rows.push({ title: 'My List', items: myListItems });
            }
            if (!filterType || filterType === 'series') {
              rows.push({ title: 'Featured Series', items: ITEMS.filter(i => i.type === 'series') });
            }
            if (!filterType || filterType === 'movie') {
              rows.push({ title: 'Popular Movies', items: ITEMS.filter(i => i.type === 'movie') });
            }
            rows.push({ title: 'Persian Dubbed & Subtitled', items: filtered });

            const startHeroPlayback = () => {
              if (hero.type === 'series') {
                const saved = progress[hero.id];
                const sNum = saved?.seasonNumber || 1;
                const eNum = saved?.episodeNumber || 1;
                nav.navigate('Player', { id: hero.id, seasonNumber: sNum, episodeNumber: eNum });
              } else {
                nav.navigate('Player', { id: hero.id });
              }
            };

            return (
              <ScrollView contentContainerStyle={{ paddingBottom: u(90) }}>
                <View style={{ height: u(760) }}>
                  <Image source={{ uri: hero.backdrop }} style={StyleSheet.absoluteFill} />
                  <LinearGradient
                    colors={['rgba(0,0,0,0.35)', 'rgba(0,0,0,0.15)', '#000000']}
                    style={StyleSheet.absoluteFill}
                  />
                  <View style={{ position: 'absolute', bottom: u(56), left: PAD, width: u(980) }}>
                    <View style={{ flexDirection: 'row', alignItems: 'center', marginBottom: u(12) }}>
                      <View
                        style={{
                          backgroundColor: C.accent,
                          paddingHorizontal: u(14),
                          paddingVertical: u(4),
                          borderRadius: u(6),
                          marginRight: u(14),
                        }}>
                        <Text style={T.badge}>{hero.type === 'series' ? 'APPLE TV+ SERIES' : 'FEATURE FILM'}</Text>
                      </View>
                      <Text style={T.meta}>{hero.quality}  •  {hero.rating}  •  FA Audio/Sub</Text>
                    </View>
                    <Text style={T.hero}>{hero.title}</Text>
                    <Text style={[T.meta, { marginTop: u(8) }]}>{hero.meta}</Text>
                    <Text numberOfLines={2} style={[T.body, { marginVertical: u(20) }]}>
                      {hero.desc}
                    </Text>
                    <View style={{ flexDirection: 'row', alignItems: 'center' }}>
                      <Button
                        preferred
