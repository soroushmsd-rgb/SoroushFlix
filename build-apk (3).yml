          cat > src/storage.js <<'END_OF_FILE'
          import AsyncStorage from '@react-native-async-storage/async-storage';

          const KEY_MYLIST = '@delfantv_mylist_v1';
          const KEY_PROGRESS = '@delfantv_progress_v1';
          const KEY_PREFS = '@delfantv_prefs_v1';

          export async function loadCache() {
            try {
              const [ml, pr, pf] = await Promise.all([
                AsyncStorage.getItem(KEY_MYLIST),
                AsyncStorage.getItem(KEY_PROGRESS),
                AsyncStorage.getItem(KEY_PREFS),
              ]);
              return {
                myList: ml ? JSON.parse(ml) : [],
                progress: pr ? JSON.parse(pr) : {},
                prefs: pf ? JSON.parse(pf) : { audioLang: 'fa', subLang: 'fa' },
              };
            } catch (e) {
              return { myList: [], progress: {}, prefs: { audioLang: 'fa', subLang: 'fa' } };
            }
          }

          export async function saveMyList(list) {
            try { await AsyncStorage.setItem(KEY_MYLIST, JSON.stringify(list)); } catch (e) {}
          }

          export async function saveProgress(prog) {
            try { await AsyncStorage.setItem(KEY_PROGRESS, JSON.stringify(prog)); } catch (e) {}
          }

          export async function savePrefs(prefs) {
            try { await AsyncStorage.setItem(KEY_PREFS, JSON.stringify(prefs)); } catch (e) {}
          }
          END_OF_FILE

