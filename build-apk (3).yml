          import React, { useEffect, useRef, useState } from 'react';
          import { StatusBar, StyleSheet, Text, View } from 'react-native';
          import Video from 'react-native-video';
          import Button from '../components/Button';
          import Focusable from '../components/Focusable';
          import { ITEMS } from '../data';
          import { C, PAD, T, u } from '../theme';

          const fmt = sec => {
            const s = Math.max(0, Math.floor(sec || 0));
            const m = Math.floor(s / 60);
            const r = s % 60;
            return `${m}:${r < 10 ? '0' : ''}${r}`;
          };

          export default function Player({ route, navigation, appState }) {
            const { id, seasonNumber = 1, episodeNumber = 1 } = route.params || {};
            const it = ITEMS.find(i => i.id === id) || ITEMS[0];
            const { prefs, updatePrefs, updateProgress, progress } = appState;

            const [sNum, setSNum] = useState(seasonNumber);
            const [eNum, setENum] = useState(episodeNumber);

            const videoRef = useRef(null);
            const [paused, setPaused] = useState(false);
            const [curTime, setCurTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [failed, setFailed] = useState(false);
            const [showOverlay, setShowOverlay] = useState(true);
            const [showLangModal, setShowLangModal] = useState(false);

            // Preferred language defaults to Persian ('fa') for both Audio & Subtitles
            const [audioLang, setAudioLang] = useState(prefs?.audioLang || 'fa');
            const [subLang, setSubLang] = useState(prefs?.subLang || 'fa');

            const isSeries = it.type === 'series';
            const seasonObj = isSeries
              ? it.seasons.find(s => s.seasonNumber === sNum) || it.seasons[0]
              : null;
            const episodeObj = isSeries
              ? seasonObj?.episodes.find(e => e.episodeNumber === eNum) || seasonObj?.episodes[0]
              : null;

            const mediaSourceUrl = isSeries ? episodeObj?.url : it.url;
            const mediaTitle = isSeries
              ? `${it.title}  •  S${sNum}:E${eNum} (${episodeObj?.title})`
              : it.title;

            const hasPrevEpisode = isSeries && (eNum > 1 || sNum > 1);
            const hasNextEpisode =
              isSeries &&
              seasonObj &&
              (eNum < seasonObj.episodes.length || sNum < it.seasons.length);

            const goPrevEpisode = () => {
              if (!isSeries) return;
              if (eNum > 1) {
                setENum(eNum - 1);
                setCurTime(0);
              } else if (sNum > 1) {
                const prevS = it.seasons.find(s => s.seasonNumber === sNum - 1);
                if (prevS) {
                  setSNum(sNum - 1);
                  setENum(prevS.episodes.length);
                  setCurTime(0);
                }
              }
            };

            const goNextEpisode = () => {
              if (!isSeries || !seasonObj) return;
              if (eNum < seasonObj.episodes.length) {
                setENum(eNum + 1);
                setCurTime(0);
              } else if (sNum < it.seasons.length) {
                setSNum(sNum + 1);
                setENum(1);
                setCurTime(0);
              }
            };

            useEffect(() => {
              if (!showOverlay || paused || showLangModal) return;
              const timer = setTimeout(() => setShowOverlay(false), 6500);
              return () => clearTimeout(timer);
            }, [showOverlay, paused, showLangModal, curTime]);

            const seekBy = delta => {
              const target = Math.max(0, Math.min(duration || 3600, curTime + delta));
              if (videoRef.current) videoRef.current.seek(target);
              setCurTime(target);
              setShowOverlay(true);
            };

            const activeCue = (() => {
              if (subLang === 'off') return null;
              const subList = (isSeries ? episodeObj?.subtitles : it.subtitles) || [];
              const track = subList.find(t => t.code === subLang) || subList[0];
              if (!track || !track.cues) return null;
              const loopTime = Math.floor(curTime) % 60;
              return track.cues.find(c => loopTime >= c.start && loopTime <= c.end);
            })();

            const selectAudio = code => {
              setAudioLang(code);
              updatePrefs({ audioLang: code, subLang });
            };

            const selectSub = code => {
              setSubLang(code);
              updatePrefs({ audioLang, subLang: code });
            };

            return (
              <View style={{ flex: 1, backgroundColor: '#000' }}>
                <StatusBar hidden />
                <Video
                  ref={videoRef}
                  source={{ uri: mediaSourceUrl }}
                  style={StyleSheet.absoluteFill}
                  resizeMode="contain"
                  paused={paused}
                  selectedAudioTrack={{ type: 'language', value: audioLang }}
                  selectedTextTrack={
                    subLang === 'off'
                      ? { type: 'disabled' }
                      : { type: 'language', value: subLang }
                  }
                  onLoad={data => {
                    setDuration(data.duration || 0);
                    setFailed(false);
                  }}
                  onProgress={data => {
                    setCurTime(data.currentTime || 0);
                    if (duration > 0) {
                      updateProgress(it.id, {
                        ratio: data.currentTime / duration,
                        seasonNumber: sNum,
                        episodeNumber: eNum,
                      });
                    }
                  }}
                  onEnd={() => {
                    if (hasNextEpisode) goNextEpisode();
                  }}
                  onError={() => setFailed(true)}
                />

                {/* Persian Subtitle Overlay */}
                {activeCue && subLang !== 'off' && (
                  <View
                    style={{
                      position: 'absolute',
                      bottom: showOverlay ? u(230) : u(84),
                      alignSelf: 'center',
                      backgroundColor: 'rgba(0,0,0,0.68)',
                      paddingHorizontal: u(32),
                      paddingVertical: u(10),
                      borderRadius: u(12),
                    }}>
                    <Text style={[T.row, { fontSize: u(34), textAlign: 'center' }]}>
                      {activeCue.text}
                    </Text>
                  </View>
                )}

                {/* Invisible wake-up surface when minimal HUD is hidden */}
                {!showOverlay && (
                  <Focusable
                    preferred
                    scale={1}
                    onPress={() => setShowOverlay(true)}
                    onFocusCallback={() => setShowOverlay(true)}
                    style={StyleSheet.absoluteFill}>
                    <View style={{ flex: 1 }} />
                  </Focusable>
                )}

                {/* Minimal Apple TV+ Player HUD */}
                {showOverlay && (
                  <View style={StyleSheet.absoluteFill} pointerEvents="box-none">
                    <LinearGradient
                      colors={['rgba(0,0,0,0.75)', 'transparent', 'rgba(0,0,0,0.88)']}
                      style={StyleSheet.absoluteFill}
                    />

                    {/* Top Minimal Info Bar */}
                    <View
                      style={{
                        position: 'absolute',
                        top: u(48),
                        left: PAD,
                        right: PAD,
                        flexDirection: 'row',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                      }}>
                      <View>
                        <Text style={[T.row, { fontSize: u(34) }]}>{mediaTitle}</Text>
                        <Text style={[T.meta, { marginTop: u(4) }]}>
                          Audio: {audioLang.toUpperCase()} (Persian Preferred)  •  Subtitle:{' '}
                          {subLang.toUpperCase()}
                        </Text>
                      </View>
                      <Button small label="Back" onPress={() => navigation.goBack()} />
                    </View>

                    {/* Bottom Scrubber & Minimal Controls */}
                    <View
                      style={{
                        position: 'absolute',
                        bottom: u(48),
                        left: PAD,
                        right: PAD,
                      }}>
                      {/* Progress Bar */}
                      <View
                        style={{
                          flexDirection: 'row',
                          alignItems: 'center',
                          marginBottom: u(24),
                        }}>
                        <Text style={[T.meta, { width: u(100) }]}>{fmt(curTime)}</Text>
                        <View
                          style={{
                            flex: 1,
                            height: u(10),
                            borderRadius: u(5),
                            backgroundColor: 'rgba(255,255,255,0.24)',
                            marginHorizontal: u(20),
                            overflow: 'hidden',
                          }}>
                          <View
                            style={{
                              width: `${
                                duration > 0 ? Math.min(100, (curTime / duration) * 100) : 0
                              }%`,
                              height: '100%',
                              backgroundColor: '#FFFFFF',
                            }}
                          />
                        </View>
                        <Text style={[T.meta, { width: u(100), textAlign: 'right' }]}>
                          {fmt(duration)}
                        </Text>
                      </View>

                      {/* Minimalist Control Deck */}
                      <View style={{ flexDirection: 'row', alignItems: 'center' }}>
                        <Button
                          preferred
                          primary
                          small
                          label={paused ? '▶ Play' : '⏸ Pause'}
                          onPress={() => setPaused(!paused)}
                        />
                        <Button small label="↺ -10s" onPress={() => seekBy(-10)} />
                        <Button small label="+10s ↻" onPress={() => seekBy(10)} />

                        {isSeries && hasPrevEpisode && (
                          <Button small label="⏮ Prev Ep" onPress={goPrevEpisode} />
                        )}
                        {isSeries && hasNextEpisode && (
                          <Button small label="Next Ep ⏭" onPress={goNextEpisode} />
                        )}

                        <Button
                          small
                          active={showLangModal}
                          label={`Audio & Sub (${audioLang.toUpperCase()}/${subLang.toUpperCase()})`}
                          onPress={() => setShowLangModal(!showLangModal)}
                        />
                      </View>
                    </View>

                    {/* Minimal Audio & Subtitle Selector Popup (Persian Default) */}
                    {showLangModal && (
                      <View
                        style={{
                          position: 'absolute',
                          bottom: u(190),
                          right: PAD,
                          width: u(720),
                          padding: u(32),
                          borderRadius: u(24),
                          backgroundColor: C.glassDark,
                          borderWidth: 1,
                          borderColor: 'rgba(255,255,255,0.18)',
                        }}>
                        <Text style={[T.row, { fontSize: u(28), marginBottom: u(14) }]}>
                          Audio Track (Preferred: Persian)
                        </Text>
                        <View style={{ flexDirection: 'row', marginBottom: u(24) }}>
                          {[
                            { code: 'fa', label: 'Persian (فارسی)' },
                            { code: 'en', label: 'Original (EN)' },
                          ].map(a => (
                            <Button
                              key={a.code}
                              small
                              active={audioLang === a.code}
                              label={a.label}
                              onPress={() => selectAudio(a.code)}
                            />
                          ))}
                        </View>

                        <Text style={[T.row, { fontSize: u(28), marginBottom: u(14) }]}>
                          Subtitles (Preferred: Persian)
                        </Text>
                        <View style={{ flexDirection: 'row' }}>
                          {[
                            { code: 'fa', label: 'Persian (فارسی)' },
                            { code: 'en', label: 'English' },
                            { code: 'off', label: 'Off' },
                          ].map(s => (
                            <Button
                              key={s.code}
                              small
                              active={subLang === s.code}
                              label={s.label}
                              onPress={() => selectSub(s.code)}
                            />
                          ))}
                        </View>
                      </View>
                    )}
                  </View>
                )}

                {failed && (
                  <View
                    style={{
                      ...StyleSheet.absoluteFillObject,
                      alignItems: 'center',
                      justifyContent: 'center',
                      backgroundColor: 'rgba(0,0,0,0.85)',
                    }}>
                    <Text style={[T.row, { marginBottom: u(24) }]}>
                      Stream playback error. Please check your connection or try another episode.
                    </Text>
                    <Button primary label="Back to Details" onPress={() => navigation.goBack()} />
                  </View>
                )}
              </View>
            );
          }
          END_OF_FILE

          cat > App.js <<'END_OF_FILE'
          import React, { useEffect, useState } from 'react';
          import { BackHandler, View } from 'react-native';
          import Main from './src/screens/Main';
          import Details from './src/screens/Details';
          import Player from './src/screens/Player';
          import { loadCache, saveMyList, savePrefs, saveProgress } from './src/storage';

          export default function App() {
            const [stack, setStack] = useState([{ name: 'Main', params: {} }]);
            const [myList, setMyList] = useState([]);
            const [progress, setProgress] = useState({});
            const [prefs, setPrefs] = useState({ audioLang: 'fa', subLang: 'fa' });

            useEffect(() => {
              loadCache().then(data => {
                setMyList(data.myList);
                setProgress(data.progress);
                setPrefs(data.prefs);
              });
            }, []);

            const toggleMyList = id => {
              setMyList(prev => {
                const next = prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id];
                saveMyList(next);
                return next;
              });
            };

            const updateProgress = (id, info) => {
              setProgress(prev => {
                const next = { ...prev, [id]: { ...(prev[id] || {}), ...info, updatedAt: Date.now() } };
                saveProgress(next);
                return next;
              });
            };

            const updatePrefs = newPrefs => {
              setPrefs(prev => {
                const next = { ...prev, ...newPrefs };
                savePrefs(next);
                return next;
              });
            };

            const current = stack[stack.length - 1];

            const navigation = {
              navigate: (name, params = {}) => setStack(s => [...s, { name, params }]),
              goBack: () => setStack(s => (s.length > 1 ? s.slice(0, -1) : s)),
            };

            useEffect(() => {
              const sub = BackHandler.addEventListener('hardwareBackPress', () => {
                if (stack.length > 1) {
                  setStack(s => s.slice(0, -1));
                  return true;
                }
                return false;
              });
              return () => sub.remove();
            }, [stack.length]);

            const appState = {
              myList,
              toggleMyList,
              progress,
              updateProgress,
              prefs,
              updatePrefs,
            };

            return (
              <View style={{ flex: 1, backgroundColor: '#000' }}>
                {current.name === 'Main' && (
                  <Main navigation={navigation} route={current} appState={appState} />
                )}
                {current.name === 'Details' && (
                  <Details navigation={navigation} route={current} appState={appState} />
                )}
                {current.name === 'Player' && (
                  <Player navigation={navigation} route={current} appState={appState} />
                )}
              </View>
            );
          }
          END_OF_FILE

      - name: Download Vazir font
        run: |
          curl -fL -o DelfanTV/assets/fonts/Vazir.ttf https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf || rm -f DelfanTV/assets/fonts/Vazir.ttf
          cd DelfanTV && npx --yes react-native-asset

      - name: Configure LTR English UI layout
        run: |
          python3 - <<'EOF'
          import glob
          files = glob.glob('DelfanTV/android/**/MainApplication.*', recursive=True)
          for f in files:
              with open(f, 'r', encoding='utf-8') as fp:
                  code = fp.read()
              if 'I18nUtil' not in code:
                  semi = ';' if f.endswith('.java') else ''
                  code = code.replace(
                      'import com.facebook.react.ReactApplication',
                      f'import com.facebook.react.modules.i18nmanager.I18nUtil{semi}\nimport com.facebook.react.ReactApplication'
                  )
                  code = code.replace(
                      'super.onCreate()',
                      f'super.onCreate(){semi}\n    I18nUtil.getInstance().allowRTL(this, false){semi}\n    I18nUtil.getInstance().forceRTL(this, false){semi}'
                  )
                  with open(f, 'w', encoding='utf-8') as fp:
                      fp.write(code)
          EOF

      - name: Build release APK
        run: |
          cd DelfanTV/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DelfanTV-apk
          path: DelfanTV/android/app/build/outputs/apk/release/*.apk
