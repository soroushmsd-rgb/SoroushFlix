          import React, { useRef, useState } from 'react';
          import { Animated, Pressable } from 'react-native';

          export default function Focusable({
            children,
            style,
            focusedStyle,
            onPress,
            onFocusCallback,
            scale = 1.06,
            preferred,
          }) {
            const s = useRef(new Animated.Value(1)).current;
            const [f, setF] = useState(false);
            const to = v =>
              Animated.spring(s, {
                toValue: v,
                useNativeDriver: true,
                friction: 8,
                tension: 100,
              }).start();

            return (
              <Pressable
                focusable={true}
                hasTVPreferredFocus={preferred}
                onPress={onPress}
                onFocus={() => {
                  setF(true);
                  to(scale);
                  if (onFocusCallback) onFocusCallback();
                }}
                onBlur={() => {
                  setF(false);
                  to(1);
                }}>
                <Animated.View style={[style, { transform: [{ scale: s }] }, f && focusedStyle]}>
                  {typeof children === 'function' ? children(f) : children}
                </Animated.View>
              </Pressable>
            );
          }
          END_OF_FILE

