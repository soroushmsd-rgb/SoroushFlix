          export default function Button({ label, icon, primary, active, onPress, preferred, small }) {
            return (
              <Focusable
                preferred={preferred}
                onPress={onPress}
                scale={1.06}
                style={{
                  paddingHorizontal: small ? u(32) : u(46),
                  height: small ? u(62) : u(76),
                  borderRadius: u(38),
                  justifyContent: 'center',
                  alignItems: 'center',
                  flexDirection: 'row',
                  marginRight: u(20),
                  backgroundColor: active ? C.accent : primary ? '#FFFFFF' : C.glass,
                  borderWidth: u(2),
                  borderColor: 'transparent',
                }}
                focusedStyle={{
                  backgroundColor: '#FFFFFF',
                  borderColor: C.accent,
                  elevation: 12,
                }}>
                {f => (
                  <View style={{ flexDirection: 'row', alignItems: 'center' }}>
                    {icon ? (
