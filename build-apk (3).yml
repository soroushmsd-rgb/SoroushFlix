          import React from 'react';
          import { Text, View } from 'react-native';
          import Focusable from './Focusable';
          import { C, T, u } from '../theme';

          const TABS = [
            { id: 0, label: 'Watch Now' },
            { id: 1, label: 'Series' },
            { id: 2, label: 'Movies' },
            { id: 3, label: 'My List' },
            { id: 4, label: 'Search' },
          ];

          export default function TopTabs({ tab, onChange, myListCount }) {
            return (
              <View
                style={{
                  position: 'absolute',
                  top: u(32),
                  alignSelf: 'center',
                  zIndex: 20,
                  flexDirection: 'row',
                  padding: u(8),
                  borderRadius: u(48),
                  backgroundColor: C.glassDark,
                  borderWidth: 1,
                  borderColor: 'rgba(255,255,255,0.12)',
                }}>
                {TABS.map(t => {
                  const active = tab === t.id;
                  const label = t.id === 3 && myListCount > 0 ? `${t.label} (${myListCount})` : t.label;
                  return (
                    <Focusable
                      key={t.id}
                      onPress={() => onChange(t.id)}
                      scale={1.05}
                      style={{
                        paddingHorizontal: u(38),
                        height: u(64),
                        borderRadius: u(32),
                        justifyContent: 'center',
                        backgroundColor: active ? C.glass : 'transparent',
                      }}
                      focusedStyle={{ backgroundColor: '#FFFFFF' }}>
                      {f => (
                        <Text
                          style={[
                            T.btn,
                            {
                              fontSize: u(24),
                              color: f ? '#000000' : active ? '#FFFFFF' : C.dim,
                            },
                          ]}>
                          {label}
                        </Text>
                      )}
                    </Focusable>
                  );
                })}
              </View>
            );
          }
          END_OF_FILE

