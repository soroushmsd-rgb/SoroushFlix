name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: true
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create TV project
        run: |
          npx --yes @react-native-community/cli@latest init DelfanTV \
            --template @react-native-tvos/template-tv \
            --skip-install \
            --skip-git-init \
            --pm npm

      - name: Install dependencies
        run: |
          cd DelfanTV
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps \
            react-native-video@^6.6.4 \
            react-native-linear-gradient@^2.8.3 \
            @react-native-async-storage/async-storage@^1.24.0

      - name: Write app files
        run: |
          cd DelfanTV
          rm -f App.tsx
          mkdir -p src/components src/screens assets/fonts

          cat > index.js <<'END_OF_FILE'
          import { AppRegistry, I18nManager } from 'react-native';
          import App from './App';

          // Keep UI in English LTR (Apple TV layout) while supporting Persian audio/subtitles & content
          I18nManager.allowRTL(false);
          I18nManager.forceRTL(false);

          AppRegistry.registerComponent('DelfanTV', () => App);
          END_OF_FILE

          cat > react-native.config.js <<'END_OF_FILE'
          module.exports = { assets: ['./assets/fonts'] };
          END_OF_FILE

          cat > src/theme.js <<'END_OF_FILE'
